<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Nota</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <form method="POST">

        <input
            type="text"
            name="titulo"
            value="{{ nota.not_titulo }}"
            required
        >

        <textarea
            name="conteudo"
            required
        >{{ nota.not_conteudo }}</textarea>

        <div class="d-flex gap-2 mt-3">

            <button
                type="submit"
                class="btn-destaque">
                Salvar Alterações
            </button>

            <a href="/" class="btn-commum text-decoration-none">
                Voltar
            </a>

        </div>

    </form>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ENjdO4Dr2bkBIFxQpeoA6Dk2F3xXeDdY8VXGmD6cy6ZLfYAMo5aW6fMdJ0m8Qbsw"
        crossorigin="anonymous"></script>

</body>

</html>
