<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Nota</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-ENjdO4Dr2bkBIFxQpeoA6Dk2F3xXeDdY8VXGmD6cy6ZLfYAMo5aW6fMdJ0m8Qbsw" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <form method="POST">

        <input type="text" name="titulo" placeholder="Título" required>

        <textarea name="conteudo" rows="15" cols="60" placeholder="Digite sua nota aqui..." required></textarea>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-destaque">
                Salvar Nota
            </button>

            <a href="/" class="btn btn-commum">
                Cancelar
            </a>
        </div>

    </form>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ENjdO4Dr2bkBIFxQpeoA6Dk2F3xXeDdY8VXGmD6cy6ZLfYAMo5aW6fMdJ0m8Qbsw"
        crossorigin="anonymous"></script>
</body>

</html>
